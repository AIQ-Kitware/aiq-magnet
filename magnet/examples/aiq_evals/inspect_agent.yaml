# Inspect agent/tool evaluation through aiq-magnet-evals. See magnet/examples/aiq_evals/README.md.
name: aiq_evals_inspect_agent
title: Inspect agent/tool evaluation through aiq-magnet-evals
description: Inspect use_tools solver calling a tool that runs inside Inspect's local sandbox. Set perf_params.worker_python
  to the engine interpreter (for example with --params); the example tasks ship in the aiq-magnet-evals
  package.
version: '1.0'
organizations:
- Kitware
submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com
links:
- title: aiq-magnet-evals
  url: https://github.com/Erotemic/aiq-magnet-evals
  type: software
tags:
- example
- aiq-magnet-evals
- inspect_ai
- agentic
claim:
  python: assert metrics.evaluate.score == 1.0
evidence:
  scope: requested
kwdagger:
  result_node: evaluate
  pipeline:
    nodes:
      evaluate:
        class: magnet.backends.aiq_evals.EvaluationNode
        algo_params:
          engine: inspect_ai
          task: python:magnet_evals.examples.inspect_tasks:sandbox_task
          data_revision: example-v1
          models:
          - role: primary
            model: local
            provider: aiq_example
            revision: local-v1
          engine_options:
            registration_modules:
            - magnet_evals.examples.inspect_tasks
          select:
            scorer: match
            metric: accuracy
        perf_params:
          worker_python: null
