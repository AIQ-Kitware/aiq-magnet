# HELM generation through aiq-magnet-evals. See magnet/examples/aiq_evals/README.md.
name: aiq_evals_helm_generation
title: HELM generation through aiq-magnet-evals
description: HELM simple_mcqa with the local simple model, obtained through aiq-magnet-evals. Set perf_params.worker_python
  to the engine interpreter (for example with --params); the example tasks ship in the aiq-magnet-evals
  package.
version: '1.0'
organizations:
- Kitware
submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com
links:
- title: aiq-magnet-evals
  url: https://github.com/Erotemic/aiq-magnet-evals
  type: software
tags:
- example
- aiq-magnet-evals
- helm
claim:
  python: assert metrics.evaluate.score >= 0.0
evidence:
  scope: requested
kwdagger:
  result_node: evaluate
  pipeline:
    nodes:
      evaluate:
        class: magnet.backends.aiq_evals.EvaluationNode
        algo_params:
          engine: helm
          task: simple_mcqa
          task_revision: helm-builtin
          data_revision: helm-builtin
          models:
          - role: primary
            model: simple/model1
            revision: local-v1
          task_options:
            max_eval_instances: 10
          select:
            metric: exact_match
            group: test
            score: null
        perf_params:
          worker_python: null
