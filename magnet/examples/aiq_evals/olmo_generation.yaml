# OLMo Eval generation through aiq-evals. See magnet/examples/aiq_evals/README.md.
name: aiq_evals_olmo_generation
title: OLMo Eval generation through aiq-evals
description: OLMo Eval mock-provider scored generation. Deterministic fixture tasks
  from an aiq-evals source checkout (tests/native); set perf_params.worker_python
  to the engine interpreter.
version: '1.0'
organizations:
- Kitware
submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com
links:
- title: aiq-evals
  url: https://github.com/AIQ-Kitware/aiq-evals
  type: software
tags:
- example
- aiq-evals
- olmo_eval
claim:
  python: assert metrics.evaluate.score == 1.0
evidence:
  scope: requested
kwdagger:
  result_node: evaluate
  pipeline:
    nodes:
      evaluate:
        class: magnet.backends.aiq_evals.EvaluationNode
        algo_params:
          engine: olmo_eval
          task_revision: fixture-v1
          data_revision: fixture-v1
          engine_options:
            upstream_revision: 73ade80e24f796af55caeb8fd7b75a7f3fd607fd
            task_modules:
            - tests.native.olmo_fixture
          task: aiq_p1_local
          models:
          - role: primary
            model: mock
            provider: mock
            revision: local-v1
          select:
            metric: contains_42
        perf_params:
          worker_python: null
