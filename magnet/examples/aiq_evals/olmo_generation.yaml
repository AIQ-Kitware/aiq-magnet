# OLMo Eval generation through aiq-magnet-evals. See magnet/examples/aiq_evals/README.md.
name: aiq_evals_olmo_generation
title: OLMo Eval generation through aiq-magnet-evals
description: OLMo Eval scored generation with the mock provider. Set perf_params.worker_python to the
  engine interpreter (for example with --params); the example tasks ship in the aiq-magnet-evals package.
version: '1.0'
organizations:
- Kitware
submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com
links:
- title: aiq-magnet-evals
  url: https://github.com/Erotemic/aiq-magnet-evals
  type: software
tags:
- example
- aiq-magnet-evals
- olmo_eval
claim:
  python: assert metrics.evaluate.score == 1.0
evidence:
  scope: requested
kwdagger:
  result_node: evaluate
  pipeline:
    nodes:
      evaluate:
        class: magnet.backends.aiq_evals.EvaluationNode
        algo_params:
          engine: olmo_eval
          task: aiq_example_local
          task_revision: example-v1
          data_revision: example-v1
          models:
          - role: primary
            model: mock
            provider: mock
            revision: local-v1
          engine_options:
            upstream_revision: 73ade80e24f796af55caeb8fd7b75a7f3fd607fd
            task_modules:
            - magnet_evals.examples.olmo_tasks
          select:
            metric: contains_42
        perf_params:
          worker_python: null
