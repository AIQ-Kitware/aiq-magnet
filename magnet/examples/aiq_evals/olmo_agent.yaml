# OLMo Eval agent/tool evaluation through aiq-evals. See magnet/examples/aiq_evals/README.md.
name: aiq_evals_olmo_agent
title: OLMo Eval agent/tool evaluation through aiq-evals
description: 'OLMo Eval OpenAI Agents scaffold calling a registered tool against an
  OpenAI-compatible endpoint. Point provider_options.base_url at a server, or lease
  one: set perf_params.endpoint to an infer-stack alias and the model binding to its
  served name. Deterministic fixture tasks from an aiq-evals source checkout (tests/native);
  set perf_params.worker_python to the engine interpreter.'
version: '1.0'
organizations:
- Kitware
submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com
links:
- title: aiq-evals
  url: https://github.com/AIQ-Kitware/aiq-evals
  type: software
tags:
- example
- aiq-evals
- olmo_eval
- agentic
claim:
  python: assert metrics.evaluate.score == 1.0
evidence:
  scope: requested
kwdagger:
  result_node: evaluate
  pipeline:
    nodes:
      evaluate:
        class: magnet.backends.aiq_evals.EvaluationNode
        algo_params:
          engine: olmo_eval
          task_revision: fixture-v1
          data_revision: fixture-v1
          engine_options:
            upstream_revision: 73ade80e24f796af55caeb8fd7b75a7f3fd607fd
            task_modules:
            - tests.native.olmo_fixture
            required_secrets:
            - OPENAI_API_KEY
            harness_config:
              scaffold: openai_agents
              tools:
              - double
              scaffold_kwargs:
                enable_compaction: false
          task: aiq_p1_tool
          models:
          - role: primary
            model: gpt-4o-mini
            provider: litellm
            revision: local-script-v1
            provider_options:
              base_url: http://127.0.0.1:8000/v1
          select:
            metric: contains_42
        perf_params:
          worker_python: null
