title: "Two equivalent programs have very different runtime"

description: |
  Two Python implementations compute the same Fibonacci number. One uses the
  textbook naive recursion and the other uses a simple loop. The card measures
  both and observes that the recursive implementation is slower.

  Imagine we did not yet know why. The runtime observation itself motivates an
  open theoretical question. A small Lean cost model then gives a known
  structural explanation: naive recursion repeats subproblems and performs far
  more abstract work, while iteration takes one step per input index.

  The source keeps those claims separate. The benchmark `motivates` the open
  question, while its wall-clock timing only `approximates` the abstract cost
  theorem. Lean does not claim to model CPython timing.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

