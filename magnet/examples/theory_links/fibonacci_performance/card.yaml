title: "Two equivalent programs have very different runtime"

description: |
  Two Python implementations compute the same Fibonacci number. One uses the
  textbook naive recursion and the other uses a simple loop. The card measures
  both and observes that the recursive implementation is slower.

  Imagine we did not yet know why. The runtime observation itself motivates an
  open theoretical question. A small Lean cost model then gives a known
  structural explanation: naive recursion repeats subproblems and performs far
  more abstract work, while iteration takes one step per input index.

  The source keeps those claims separate. The benchmark `motivates` the open
  question, while its wall-clock timing only `approximates` the abstract cost
  theorem. Lean does not claim to model CPython timing.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

theory:
  empirical_sources:
    - experiment.py
  indexes:
    - theory.yaml

# A single benchmark node: there is one phenomenon to observe, and repeats are
# handled inside the timing rather than by fanning out jobs.
kwdagger:
  result_node: benchmark

  pipeline:
    nodes:
      benchmark:
        executable: >-
          python -m
          magnet.examples.theory_links.fibonacci_performance.experiment
        algo_params:
          repeats: 5
        out_paths:
          out_fpath: fibonacci_performance.json
        primary_out_key: out_fpath

evidence:
  scope: requested

claim:
  python: |
    assert benchmark.same_value, (
        "the implementations no longer compute the same function"
    )
    assert benchmark.recursive_slower, (
        "the empirical phenomenon was not observed on this run"
    )
    assert benchmark.abstract_cost_gap, (
        "the Python cost model no longer matches the formal n=28 example"
    )

symbols:
  benchmark.speed_ratio:
    metadata:
      display_name: "Recursive / iterative runtime"
      display: True
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: 'mean'
