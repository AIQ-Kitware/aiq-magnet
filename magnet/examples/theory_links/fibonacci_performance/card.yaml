theory:
  empirical_sources:
    - experiment.py
  indexes:
    - theory.yaml

claim:
  python: |
    assert result['same_value'], (
        "the implementations no longer compute the same function"
    )
    assert result['recursive_slower'], (
        "the empirical phenomenon was not observed on this run"
    )
    assert result['abstract_cost_gap'], (
        "the Python cost model no longer matches the formal n=28 example"
    )

symbols:
  result:
    type: dict
    python: |
      from magnet.examples.theory_links.fibonacci_performance.experiment import (
          benchmark_fibonacci)
      result = benchmark_fibonacci(repeats=5)
