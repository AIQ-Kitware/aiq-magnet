# What the coin flip experiment points at.
#
# Stated and proved in CoinFlip.lean beside this file.
#
#   MAGNET_LEAN_PROJECT=<a lean project with mathlib built> ../check_lean.sh

entries:
  - id: Examples.CoinFlip.Binomial
    kind: theorem
    declaration: MagnetExamples.CoinFlip.card_heads_eq_choose
    statement: >
      Exactly choose(n, k) of the 2^n sequences of n flips show k heads, so
      each head count has probability choose(n, k) / 2^n.
