title: "Enumerated coin flips match the binomial law"

description: |
  Theory says exactly what should happen, and the experiment checks it.

  Enumerating all 2^n sequences of n fair flips gives the probability of each
  head count. The binomial law states the same quantity in closed form. The
  two agree exactly, with no sampling and no tolerance, so the deviation is
  zero rather than small.

  This is what `theory.tests` means: the theoretical object predicts the
  outcome, and the code confirms it.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

# The statement is proved in CoinFlip.lean beside this file. The theory block
# is unchanged by the port: the annotation lives in the code the node runs, and
# the link is read from source either way.
theory:
  empirical_sources:
    - experiment.py
  indexes:
    - theory.yaml

# One job per flip count, one verdict each, and the enumeration cached in the
# shared store so a re-run does not redo it.
#
# The node is named `enumeration`, not `enumerate`: a claim can address a node
# by its bare name, and a node named for a Python builtin would shadow it.
kwdagger:
  result_node: enumeration

  pipeline:
    nodes:
      enumeration:
        executable: "python -m magnet.examples.theory_links.coin_flip.experiment"
        algo_params:
          n_flips: 10
        out_paths:
          out_fpath: coin_flip.json
        primary_out_key: out_fpath

  # Enumeration is exponential in n_flips, so this stays small on purpose.
  matrix:
    enumeration.n_flips: [8, 10, 12, 14]

# Judge this invocation's flip counts, not every enumeration ever cached.
evidence:
  scope: requested

claim:
  python: |
    assert enumeration.deviation == 0, (
        f"enumeration departs from the binomial law by {enumeration.deviation}"
    )

symbols:
  enumeration.deviation:
    metadata:
      display_name: "Max deviation from the binomial law"
      display: True
      define_metric:
        objective: minimize
        aggregation_strategy:
          type: 'max'
