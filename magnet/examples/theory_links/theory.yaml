# The theoretical objects the example code points at.
#
# Three kinds are available. A question can become a conjecture and then a
# theorem while keeping its id, so the code pointing at it keeps working as the
# theory around it develops.

entries:
  - id: Examples.CoinFlip.Binomial
    kind: theorem
    statement: >
      For n independent fair flips, the probability of exactly k heads is
      C(n, k) / 2^n.

  - id: Examples.Circle.AreaRatio
    kind: theorem
    statement: >
      The quarter disc of radius 1 occupies pi/4 of the unit square, so the
      fraction of uniformly drawn points falling inside it converges to pi/4.

  - id: Examples.TrainingOrder.Why
    kind: question
    statement: >
      Why can changing only the order of otherwise identical training
      observations change the learned solution, and under what conditions
      should a learning rule be order-invariant?
