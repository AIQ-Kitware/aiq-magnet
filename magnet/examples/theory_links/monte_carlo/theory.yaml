# What the Monte Carlo experiment points at.
#
# No Lean here. Stating the area of a quarter disc needs measure theory over
# the reals, so this entry carries prose and no `declaration` until the
# statement is formalized. An entry without a declaration is valid; it just
# says nobody has written it down formally yet.

entries:
  - id: Examples.Circle.AreaRatio
    kind: theorem
    statement: >
      The quarter disc of radius 1 occupies pi/4 of the unit square, so the
      fraction of uniformly drawn points landing inside it converges to pi/4.
