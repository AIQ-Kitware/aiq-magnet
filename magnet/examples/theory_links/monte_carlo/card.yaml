name: monte_carlo
title: "Monte Carlo estimate of a known area ratio"

description: |
  Theory defines an exact area and an asymptotic sampling theorem. The
  experiment estimates the area with a deterministic seeded LCG.

  The source therefore makes two statement-level approximation links and also
  accounts for the sampling theorem's named premises. It marks the geometric
  hit predicate as matching the formal region, explicitly assumes the
  measurability bridge, records that the LCG substitutes for uniform random
  draws, and leaves the IID-independence premise unaccounted.

  That missing premise is intentional: the generated `theory.json` demonstrates
  how MAGNET reports a static theory/practice gap without recording runtime
  values or claiming the Python implementation has been formally verified.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

# Circle.lean contains both the exact area theorem and the asymptotic sampling
# theorem. The latter exposes named premises that experiment.py accounts for
# statically. Independence is deliberately left unaccounted. None of that
# changes under kwdagger: the annotations live in the code the node runs.
theory:
  empirical_sources:
    - experiment.py
  indexes:
    - theory.yaml

# One job per seed, which is what turns a single estimate into a statement
# about the estimator.
kwdagger:
  result_node: estimate

  pipeline:
    nodes:
      estimate:
        executable: "python -m magnet.examples.theory_links.monte_carlo.experiment"
        algo_params:
          seed: 1
          samples: 20000
        out_paths:
          out_fpath: monte_carlo.json
        primary_out_key: out_fpath

  matrix:
    estimate.samples: 20000
    estimate.seed: [1, 2, 3, 4, 5]

# Judge this invocation's seeds, not every seed ever run.
evidence:
  scope: requested

# One verdict per seed. The theorem is asymptotic and every cell here is
# finite, so a passing verdict is evidence about the estimator at this sample
# size rather than a test of the limit.
claim:
  python: |
    assert estimate.error < tolerance, (
        f"estimate is off by {estimate.error:.5f}, "
        f"over the {tolerance} tolerance"
    )
    assert estimate.error > 0, (
        "a finite sample landing exactly on pi/4 would mean the estimator "
        "is not doing what this card says it does"
    )

symbols:
  # The bound the claim tests against is the card's, not the pipeline's.
  tolerance:
    type: float
    value: 0.01

  estimate.error:
    metadata:
      display_name: "Absolute error"
      display: True
      define_metric:
        objective: minimize
        aggregation_strategy:
          type: 'mean'
