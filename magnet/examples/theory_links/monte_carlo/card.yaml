title: "Monte Carlo estimate of a known area ratio"

description: |
  Theory defines something exact, and the experiment estimates it.

  A quarter disc occupies pi/4 of the unit square. Sampling points and counting
  how many land inside estimates that ratio. The estimate is deterministic here
  because the sampler is seeded, and it is wrong by a small amount that the
  closed form is not.

  This is what `theory.approximates` means: the theoretical object is exact,
  and the code produces a finite-sample version of it.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

# Under the kwdagger work, when it lands: one job per seed, which is what turns
# a single estimate into a statement about the estimator. The pipeline can be
# inline, so the whole port is this block.
#
#   kwdagger:
#     pipeline:
#       nodes:
#         estimate:
#           executable: 'python -m magnet.examples.theory_links.monte_carlo.experiment'
#           out_paths: {out_fpath: 'monte_carlo.json'}
#           primary_out_key: out_fpath
#           algo_params:
#             seed: 1
#             samples: 20000
#     result_node: estimate
#     matrix:
#       estimate.samples: 20000
#       estimate.seed: [1, 2, 3, 4, 5]
#
#   evidence:
#     - measures: metrics.estimate.error
#       relation: {lt: 0.01}
#       scope: "5 seeds at 20000 samples"
#       relaxes: "finitely many samples; the theorem is a limit"
#
# The theory block below does not change.

# The statement is in Circle.lean beside this file. The unit-disc area is
# proved from Mathlib's `Complex.volume_closedBall`; the quarter disc this
# card samples is stated and unproved.
theory:
  sources:
    - experiment.py
  entries:
    - id: Examples.Circle.AreaRatio
      kind: theorem
      declaration: MagnetExamples.Circle.volume_quarterDisc
      source: Circle.lean
      statement: >
        The quarter disc of radius 1 occupies pi/4 of the unit square, so
        the fraction of uniformly drawn points landing inside it converges
        to pi/4.

claim:
  python: |
    assert error < tolerance, (
        f"estimate is off by {error:.5f}, over the {tolerance} tolerance"
    )
    assert error > 0, (
        "a finite sample landing exactly on pi/4 would mean the estimator "
        "is not doing what this card says it does"
    )

symbols:
  seed:
    type: int
    value: 1

  samples:
    type: int
    value: 20000

  tolerance:
    type: float
    value: 0.01

  error:
    type: float
    depends_on:
      - seed
      - samples
    python: |
      from magnet.examples.theory_links.monte_carlo.experiment import estimation_error
      error = estimation_error(seed, samples)
