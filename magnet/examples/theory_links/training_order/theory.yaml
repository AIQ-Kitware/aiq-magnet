# What the training order experiment points at.
#
# Stated in TrainingOrder.lean beside this file. The Lean side proves that
# order invariance is a real restriction; the question itself is open.
#
#   MAGNET_LEAN_PROJECT=<a lean project with mathlib built> ../check_lean.sh

entries:
  - id: Examples.TrainingOrder.Why
    kind: question
    declaration: MagnetExamples.TrainingOrder.OrderInvariant
    statement: >
      Why can changing only the order of otherwise identical training
      observations change the learned solution, and under what conditions
      should a learning rule be order-invariant?
