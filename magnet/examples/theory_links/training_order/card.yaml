title: "Training order changes the learned solution"

description: |
  The experiment establishes a phenomenon, and theory is asked to explain it.

  An online perceptron sees the same four observations in opposite orders and
  classifies a probe point differently. Nothing is random, nothing stops early,
  and the two runs differ only in the order of otherwise identical evidence.

  The card claims the phenomenon and nothing more. Why it happens, and when a
  learning rule should be order-invariant, is the open question it points at.

  This is what `theory.motivates` means: practice finds something, and theory
  is given something to explain.

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - theory

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"

# Under the kwdagger work, when it lands: one job per probe point, so the card
# reports where the two orders disagree rather than only that they do. The
# pipeline can be inline, so the whole port is this block.
#
#   kwdagger:
#     pipeline:
#       nodes:
#         compare:
#           executable: 'python -m magnet.examples.theory_links.training_order.experiment'
#           out_paths: {out_fpath: 'training_order.json'}
#           primary_out_key: out_fpath
#           algo_params:
#             probe: '-0.8,0.8'
#     result_node: compare
#     matrix:
#       compare.probe: ['-0.8,0.8', '0.6,0.55', '0.0,0.0']
#
#   # `any`, because the finding is that the orders disagree SOMEWHERE. Two of
#   # the probes above sit where both orders agree, and a sweep that hid that
#   # would be picking its evidence.
#   claim_aggregation_strategy:
#     type: any
#
#   evidence:
#     - measures: metrics.compare.disagrees
#       relation: {eq: true}
#       scope: "one pass of the perceptron rule, four observations"
#
# The theory block below does not change.

# The property is defined in TrainingOrder.lean beside this file, which
# proves order invariance is a real restriction. The question is open.
theory:
  empirical_sources:
    - experiment.py
  indexes:
    - theory.yaml

claim:
  python: |
    assert disagrees, (
        "both orders reached the same prediction; this card exists to "
        "exhibit the disagreement"
    )

symbols:
  disagrees:
    type: bool
    python: |
      from magnet.examples.theory_links.training_order.experiment import (
          training_order_sensitivity)
      disagrees = training_order_sensitivity()['disagrees']
