# Preliminary Working Evaluation Recipe Example

title: "In-domain Model Consistency for Llama Family"
description: |
  Performance in a single domain benchmark should be consistent within a bound of variation for an entire model family

version: 1.0

organizations:
  - Kitware

submitter:
  name: Kitware TA2 Team
  email: aiq-ta2@kitware.com

tags:
  - example
  - llama
  - helm
  - mmlu

links:
  - title: "MAGNET"
    url: "https://github.com/AIQ-Kitware/aiq-magnet"
    type: "software"
  - title: "mmlu"
    url: "https://huggingface.co/datasets/cais/mmlu"
    type: "dataset"
  - title: "Precomputed HELM lite benchmark outputs"
    url: "https://console.cloud.google.com/storage/browser/crfm-helm-public/lite"
    type: "asset"

# A claim addresses a kwdagger aggregate column two ways. `<node>.<field>` is
# the short form used here. The qualified `<namespace>.<node>.<field>` --
# `metrics.llama_compare.gap` -- always works and is what the recipe records as
# evidence either way. The short form resolves wherever the node reports that
# name once; where two namespaces report it and disagree, it refuses and names
# them, because which one a verdict rested on should never be a matter of luck.
claim:
  python: |
    c = llama_compare
    assert c.gap < c.threshold, f"{c.comp_model} score ({c.comp_score:.2f}) exceeds consistency bound on {c.base_model} ({c.base_score:.2f})"

# Keep this demo snapshot tied to the matrix requested by this invocation even
# if the shared KWDagger store contains results from earlier experiments.
evidence:
  scope: requested

# Symbol metadata for the visualization dashboard and for BAA metric
# identification. A kwdagger recipe does not compute these values -- the
# pipeline already did -- so each symbol is named for the evidence column it
# describes and carries only what the artifact cannot: what the number is
# called and whether it defines a metric.
#
# A symbol names its column the same way a claim does: by node, or qualified
# by namespace as well. Name it by node where the node reports the field once,
# as `llama_compare.base_score` does -- `metrics` is where kwdagger filed it,
# not part of what it is. A bare `base_score` would resolve too, but both
# nodes report that field, so it says less than it looks like it does.
#
# Qualify where the namespace is the meaning. `resolved_params` says this is
# the path the node actually ran with rather than the one the matrix asked
# for; `llama_predict.helm_runs_path` would match `metrics`, `params` and
# `resolved_params` alike and quietly settle for whichever sorted first. Those
# three agree today. The symbol is labelled for the resolved value, so it
# should not depend on their continuing to.
#
# `aggregation_strategy` reduces across the recipe's evidence rows -- the 36
# model-pair cells below. Reduction *within* a run belongs to a kwdagger
# fan-in node, which reports its aggregate as a single node output for a
# symbol like this one to read off.
symbols:
  llama_compare.base_score:
    metadata:
      display_name: "Average Exact Match"
      display: True
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: 'mean'

  resolved_params.llama_predict.helm_runs_path:
    metadata:
      display_name: "HELM Data Path"
      display: True

kwdagger:
  # MAGNET asks KWDagger aggregate for every available result row from this
  # node in the shared result store. Its metrics appear as
  # llama_compare.<field>, or metrics.llama_compare.<field> qualified, in the
  # transitional Python claim above.
  result_node: llama_compare

  # This is a native declarative KWDagger pipeline. The node interfaces are
  # intentionally written out here so the complete example is visible in one
  # file. A separate example can demonstrate ProcessNode / kwconf-derived
  # interfaces later.
  pipeline:
    nodes:
      # Read cached HELM-Lite results for one base/comparison model pair and
      # materialize the two scores as a JSON artifact.
      llama_predict:
        # KWDagger formats the declared parameters onto this executable's CLI.
        executable: "python -m magnet.examples.llama_consistency.llama_predict"
        # Algorithm parameters are ordinary configurable values. Matrix keys
        # below address them as <node>.<parameter>.
        algo_params:
          base_model: null
          comp_model: null
          threshold: 0.1
          helm_runs_path: "./data/crfm-helm-public/lite/benchmark_output"
        # Output paths are artifacts produced by this node.
        out_paths:
          results_fpath: results.json
        # Marks the output that represents this node's primary result artifact.
        primary_out_key: results_fpath
        # This example predates KWDagger's generic result envelope, so its
        # loader maps the existing flat JSON + ProcessContext into the normal
        # aggregate namespaces without changing the artifact format.
        load_result: "magnet.examples.llama_consistency.llama_predict.load_kwdagger_result"

      # Reduce the score artifact to the gap consumed by the card claim. This
      # second stage is pedagogical: this particular calculation could live in
      # llama_predict, but keeping it separate demonstrates a real artifact
      # edge and explicit result-node handoff.
      llama_compare:
        executable: "python -m magnet.examples.llama_consistency.llama_compare"
        # This input path is supplied by the edge below rather than the matrix.
        in_paths: [scores_fpath]
        out_paths:
          out_fpath: comparison.json
        # KWDagger aggregate discovers this primary artifact. The custom
        # loader maps its existing flat JSON into metrics.llama_compare.*.
        primary_out_key: out_fpath
        load_result: "magnet.examples.llama_consistency.llama_compare.load_kwdagger_result"

    # Connecting an output port to an input port both supplies the artifact
    # path and establishes the execution dependency.
    edges:
      - llama_predict.results_fpath -> llama_compare.scores_fpath

  # KWDagger expands this matrix into concrete pipeline configurations. The
  # two six-element axes below form the 36 model-pair cells for this recipe.
  matrix:
    llama_predict.helm_runs_path: './data/crfm-helm-public/lite/benchmark_output'
    llama_predict.base_model:
      - meta/llama-2-13b
      - meta/llama-2-70b
      - meta/llama-2-7b
      - meta/llama-3-70b
      - meta/llama-3-8b
      - meta/llama-65b
    llama_predict.comp_model:
      - meta/llama-2-13b
      - meta/llama-2-70b
      - meta/llama-2-7b
      - meta/llama-3-70b
      - meta/llama-3-8b
      - meta/llama-65b
