[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=80.9" ]

[project]
name = "aiq-magnet"
description = "Kitware's MAGNET framework for AIQ"
license.text = "Apache 2"
authors = [ { name = "MAGNET Kitware", email = "aiq-ta2@kitware.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "readme", "version" ]
dependencies = [
  # The core: cards, claims, theory annotations, kwdagger execution,
  # containers. Everything that parses HELM output, or leases inference
  # endpoints, is an extra -- a team whose card is a kwdagger pipeline over
  # its own artifacts should not pull torch through crfm-helm to run it.
  "dacite>=1.9.2",
  "fsspec>=2024.9",
  # joblib and pydantic were never declared; crfm-helm's tree supplied them.
  "joblib>=1.3",
  "kwconf>=0.11.0",
  "kwdagger>=0.4.0",
  "kwutil>=0.3.8",
  "lazy-loader>=0.4",
  "loguru>=0.7.3",
  "msgspec>=0.19",
  "orjson>=3.10.15",
  "pandas>=2.2.3",
  "pydantic>=2",
  "pygtrie>=2.5",
  "pyyaml>=6.0.2",
  "rich>=14.1",
  "ruamel-yaml>=0.17.22",
  "typing-extensions>=4",
  "ubelt>=1.3.8",
]
optional-dependencies.all = [
  "aiq-magnet[optional]",
  "aiq-magnet[tests]",
]
optional-dependencies.docs = [
  "myst-parser>=0.16.1",
  "pygments>=2.9",
  "sphinx>=4.3.2",
  "sphinx-autoapi>=1.8.4",
  "sphinx-autobuild>=2021.3.14",
  "sphinx-reredirects>=0.0.1",
  "sphinx-rtd-theme>=1",
  "sphinxcontrib-napoleon>=0.7",
]
# HELM: the output loaders (magnet.backends.helm, magnet.predictor), the
# HELM-backed inference engine, the perturbation tooling and the demo data.
# crfm-helm brings torch, transformers, spacy and datasets, which is most of
# the weight of a full install.
optional-dependencies.helm = [
  "crfm-helm>=0.5.8",
  "gcsfs>=2024.9",
  "scikit-learn>=1.7.1",
]
# Per-node leasing: magnet.leasing renders an `infer-stack run` prefix and
# never imports the package, so the executable has to be in the same
# environment.
optional-dependencies.leasing = [ "infer-stack>=0.7.0" ]
# What `[optional]` installed before helm and leasing became extras (plotly
# is unused by magnet itself and kept for whoever installed it this way).
optional-dependencies.optional = [
  "aiq-magnet[helm]",
  "aiq-magnet[leasing]",
  "plotly>=6.5.2",
]
optional-dependencies.tests = [
  "coverage>=7.3",
  "pytest>=8.1.1",
  "pytest-cov>=3",
  "xdoctest>=1.2",
]
urls.Homepage = "https://github.com/AIQ-Kitware/aiq-magnet/"
urls.Repository = "https://github.com/AIQ-Kitware/aiq-magnet/"
scripts.magnet = "magnet.__main__:main"
scripts.magnet-helm-run = "magnet.backends.helm.magnet_run_helm:main"
entry-points.helm.run_specs = "magnet.backends.helm.run_specs"

[tool.setuptools]
dynamic.readme.file = [
  "README.md",
]
dynamic.readme.content-type = "text/markdown"
dynamic.version.attr = "magnet.__version__"
# Each example ships the non-Python files its card reads at evaluation time.
# The theory examples are a card, its code, its index and its Lean statement
# in one directory, so all of them have to ship; the llama example is its
# recipe and the README that walks through it.
package-data.magnet = [
  "cards/*.yaml",
  "examples/llama_consistency/*.yaml",
  "examples/llama_consistency/*.md",
  "examples/theory_links/*.md",
  "examples/theory_links/*/*.yaml",
  "examples/theory_links/*/*.lean",
  "examples/theory_links/*/*.md",
  "examples/smollm_example/*.yaml",
  "examples/smollm_example/*.md",
]
packages.find.namespaces = true
packages.find.include = [ "magnet*" ]

[tool.ruff]
target-version = "py311"
line-length = 80
format.indent-style = "space"
format.quote-style = "single"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = false
# Enable Flake8 (E, F) and isort (I) rules.
lint.select = [ "E", "F", "I" ]
# Ignore specific rules, for example, E501 (line too long) as it's handled by the formatter.
lint.ignore = [
  "E402", # Module level import not at top of file
  "E501", # line too long
]

[tool.codespell]
skip = [ "./docs/build", "./*.egg-info", "./build", "./htmlcov" ]
count = true
quiet-level = 3
ignore-words-list = [ "wont", "cant", "ANS", "doesnt", "arent", "ans", "thats", "datas", "isnt" ]

[tool.mypy]
disable_error_code = [
  "import-untyped",
]
ignore_missing_imports = true


[tool.pytest]
ini_options.addopts = "--xdoctest --xdoctest-style=google --ignore-glob=docs"
ini_options.norecursedirs = ".git build __pycache__ dev docs dockerfiles"

[tool.coverage]
report.exclude_lines = [
  ".*  # nocover",
  ".*  # pragma: no cover",
  "pragma: no cover",
]
