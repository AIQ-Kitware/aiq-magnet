name: SourceChecks

on:
  push:
    # Restricting push triggers to the default branch avoids running
    # validation twice (push + pull_request events) for every push to a PR
    # branch. Feature branches are covered by pull_request; release refs are
    # handled by release.yml.
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_aiq_magnet_evals:
    name: aiq-magnet-evals integration (HELM, Inspect, OLMo workers)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.12
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.12'
    - name: aiq-magnet-evals integration (HELM, Inspect, OLMo workers)
      shell: bash
      env:
        AIQ_MAGNET_EVALS_REPO: https://github.com/Erotemic/aiq-magnet-evals.git
        AIQ_MAGNET_EVALS_REV: 5d55369c98bac26b1055b11a6ce247820767a004
      run: |-
        python -m pip install uv
        sudo apt-get install -y tmux
        dev/ci/aiq_evals_integration.sh
